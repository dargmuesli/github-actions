name: CI optimization

permissions: {}

on:
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:
    outputs:
      continue:
        value: ${{ jobs.pr_analysis.outputs.pr_found == 'false' || github.event_name == 'pull_request' }}

jobs:
  pr_analysis:
    name: Pull request analysis
    runs-on: ubuntu-latest
    outputs:
      pr_found: ${{ steps.pr.outputs.pr_found }}
    permissions:
      pull-requests: read
    steps:
      # Replaces 8BitJonny/gh-get-current-pr 4.0.0 (filterOutClosed, filterOutDraft), which still
      # declares node20 with no release in sight (8BitJonny/gh-get-current-pr#354). Only pr_found
      # was ever read, so this reproduces just that output.
      - name: Get current PR
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN || github.token }}
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ ...context.repo, commit_sha: context.sha })
            core.setOutput('pr_found', data.some(pr => pr.state === 'open' && !pr.draft))
