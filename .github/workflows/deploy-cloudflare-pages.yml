name: Deploy (Cloudflare Pages)

permissions: {}

on:
  workflow_call:
    inputs:
      ACCOUNT_ID:
        required: true
        type: string
      BRANCH:
        type: string
      DIRECTORY:
        type: string
      PROJECT_NAME:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy
    permissions:
      contents: read
      deployments: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifact
      - name: Extract build artifact
        run: |
          tar -xzvf build-artifact.tar
      - name: Install Wrangler v4
        run: npm install --save-dev wrangler@4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          accountId: ${{ inputs.ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy ${{ inputs.DIRECTORY || '.' }} --branch ${{ inputs.BRANCH }} --project-name=${{ inputs.PROJECT_NAME }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
