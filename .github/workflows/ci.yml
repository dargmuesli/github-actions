name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - alpha
      - beta
      - main
      - master
      - renovate/**

jobs:
  ci-optimization:
    name: CI optimization
    uses: ./.github/workflows/ci-optimization.yml
    permissions:
      pull-requests: read
  lint:
    needs: ci-optimization
    if: needs.ci-optimization.outputs.continue == 'true'
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
  release-semantic:
    needs: lint
    name: Release (semantic)
    uses: ./.github/workflows/release-semantic.yml
    permissions:
      contents: write
      id-token: write
    secrets:
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
    with:
      COREPACK_ENABLED: true
      GH_APP_ID: ${{ vars.GH_APP_ID }}
