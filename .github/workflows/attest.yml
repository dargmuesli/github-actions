name: Attest

permissions: {}

on:
  workflow_call:
    inputs:
      DIGEST:
        required: true
        type: string
      IMAGE_ID:
        required: true
        type: string

jobs:
  attest:
    name: Attest
    if: inputs.DIGEST != ''
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    steps:
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{ inputs.DIGEST }}
          subject-name: ${{ inputs.IMAGE_ID }}
